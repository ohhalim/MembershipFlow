name: CD Pipeline — Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/membershipflow-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: nginx/nginx.conf
          target: /opt/membershipflow/nginx/
          strip_components: 1

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/membershipflow/

      - name: Copy telemetry agent files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.telemetry.yml,alloy/"
          target: /opt/membershipflow/

      - name: Copy backend health gate to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: .github/scripts/wait-for-backend-health.sh
          target: /opt/membershipflow/
          strip_components: 2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/membershipflow
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend
            bash wait-for-backend-health.sh
            docker compose up -d node-exporter
            docker compose restart nginx

            for required_key in \
              OBSERVABILITY_BIND_ADDRESS \
              LOKI_REMOTE_WRITE_URL \
              MYSQL_MONITORING_USERNAME \
              MYSQL_MONITORING_PASSWORD; do
              if ! grep -Eq "^${required_key}=.+$" .env; then
                echo "ERROR: ${required_key} is not configured in /opt/membershipflow/.env"
                exit 1
              fi
            done

            if grep -Eq '^OBSERVABILITY_BIND_ADDRESS=0\.0\.0\.0$' .env; then
              echo "ERROR: OBSERVABILITY_BIND_ADDRESS must not expose metrics on all interfaces"
              exit 1
            fi

            telemetry_compose="docker compose -f docker-compose.yml -f docker-compose.telemetry.yml"
            ${telemetry_compose} config -q
            ${telemetry_compose} pull alloy mysqld-exporter mysql-observability-bootstrap
            ${telemetry_compose} --profile bootstrap run --rm mysql-observability-bootstrap
            ${telemetry_compose} up -d --no-deps --force-recreate alloy mysqld-exporter
            alloy_container=$(${telemetry_compose} ps -q alloy)
            exporter_container=$(${telemetry_compose} ps -q mysqld-exporter)
            backend_container=$(${telemetry_compose} ps -q backend)
            test -n "${alloy_container}"
            test -n "${exporter_container}"
            test -n "${backend_container}"
            sleep 10
            alloy_status=$(docker inspect --format '{{.State.Status}} {{.State.Restarting}}' "${alloy_container}")
            exporter_status=$(docker inspect --format '{{.State.Status}} {{.State.Restarting}}' "${exporter_container}")
            echo "Alloy state: ${alloy_status}"
            echo "mysqld_exporter state: ${exporter_status}"
            test "${alloy_status}" = "running false"
            test "${exporter_status}" = "running false"
            docker exec "${backend_container}" \
              wget -qO- http://mysqld-exporter:9104/metrics | grep -q '^mysql_up 1'
            if ${telemetry_compose} logs --since 2m alloy | grep -Eiq 'level=error|final error sending batch'; then
              echo "ERROR: Alloy remote write failure detected"
              ${telemetry_compose} logs --since 2m alloy
              exit 1
            fi

            for legacy_service in grafana prometheus loki incident-api incident-worker; do
              legacy_container=$(docker ps -q \
                --filter "label=com.docker.compose.project=membershipflow" \
                --filter "label=com.docker.compose.service=${legacy_service}")
              if [ -n "${legacy_container}" ]; then
                echo "Stopping legacy observability service: ${legacy_service}"
                docker stop ${legacy_container}
              fi
            done
            docker image prune -f
