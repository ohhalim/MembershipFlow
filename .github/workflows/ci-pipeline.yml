name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PR 브랜치 흐름 검증
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/validate-pr-flow.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

      - name: Backend health gate 테스트
        run: bash .github/scripts/wait-for-backend-health-test.sh

      - name: Telemetry agent 배포 설정 검증
        env:
          LOKI_REMOTE_WRITE_URL: http://observability:3100/loki/api/v1/push
          MYSQL_MONITORING_USERNAME: membershipflow_monitor
          MYSQL_MONITORING_PASSWORD: ci-monitoring-password-32-characters
          DB_PASSWORD: ci-database-password
        run: |
          docker compose -f docker-compose.yml -f docker-compose.telemetry.yml config -q

      - name: Alloy 설정 검증
        env:
          LOKI_REMOTE_WRITE_URL: http://observability:3100/loki/api/v1/push
          MYSQL_MONITORING_USERNAME: membershipflow_monitor
          MYSQL_MONITORING_PASSWORD: ci-monitoring-password-32-characters
          APP_ENVIRONMENT: test
        run: |
          docker run --rm \
            -e LOKI_REMOTE_WRITE_URL \
            -e MYSQL_MONITORING_USERNAME \
            -e MYSQL_MONITORING_PASSWORD \
            -e APP_ENVIRONMENT \
            -v "${PWD}/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.18.0 \
            fmt --test /etc/alloy/config.alloy
          docker run --rm \
            -e LOKI_REMOTE_WRITE_URL \
            -e MYSQL_MONITORING_USERNAME \
            -e MYSQL_MONITORING_PASSWORD \
            -e APP_ENVIRONMENT \
            -v "${PWD}/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.18.0 \
            validate --stability.level=public-preview /etc/alloy/config.alloy

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: 빌드 권한 부여
        run: chmod +x ./gradlew

      - name: 테스트 실행
        # Testcontainers가 MySQL을 자체적으로 띄우므로 별도 서비스 컨테이너 불필요
        run: ./gradlew clean test

      - name: 테스트 결과 보고서 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ./build/reports/tests/
            ./build/reports/problems/
          retention-days: 7
