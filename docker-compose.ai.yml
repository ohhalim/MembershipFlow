services:
  ai-postgres:
    image: pgvector/pgvector:0.8.1-pg17
    profiles: ["ai"]
    environment:
      POSTGRES_DB: membershipflow_ai
      POSTGRES_USER: membershipflow_ai
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-local-ai-password}
    ports:
      - "${AI_POSTGRES_BIND_ADDRESS:-127.0.0.1}:5433:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membershipflow_ai -d membershipflow_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-elasticsearch:
    build:
      context: ./ai-assistant/docker/elasticsearch
      dockerfile: Dockerfile
    image: mf-ai-elasticsearch:9.5.3
    profiles: ["ai"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${AI_ES_PASSWORD:-local-only-dev-password}
      # 로컬 전용. 아래 ports 로 127.0.0.1 에만 노출한다. 운영 재사용 금지.
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ingest.geoip.downloader.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${AI_ES_BIND_ADDRESS:-127.0.0.1}:9208:9200"
    volumes:
      - ai_elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -u "elastic:$${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  ai-api:
    build:
      context: ./ai-assistant
      dockerfile: Dockerfile
    profiles: ["ai"]
    environment:
      AI_DATABASE_URL: postgresql+asyncpg://membershipflow_ai:${AI_POSTGRES_PASSWORD:-local-ai-password}@ai-postgres:5432/membershipflow_ai
      AI_REPOSITORY_ROOT: /workspace
      AI_CORPUS_CONFIG: /app/config/corpus.yml
      AI_BM25_INDEX_DIR: /var/lib/membershipflow-ai/bm25
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-fake}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-BAAI/bge-m3}
      AI_EMBEDDING_REVISION: ${AI_EMBEDDING_REVISION:-}
      AI_RERANKER_MODEL: ${AI_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-gemini-3.7-flash}
      AI_SPRING_BASE_URL: http://backend:8081
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      TRACE_CONTENT_ENABLED: ${TRACE_CONTENT_ENABLED:-false}
    ports:
      - "${AI_API_BIND_ADDRESS:-127.0.0.1}:8090:8090"
    volumes:
      - .:/workspace:ro
      - ai_bm25_data:/var/lib/membershipflow-ai/bm25
      - ai_model_cache:/root/.cache/huggingface
    depends_on:
      ai-postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai_postgres_data:
  ai_elasticsearch_data:
  ai_bm25_data:
  ai_model_cache:
