[project]
name = "membershipflow-ai-assistant"
version = "0.1.0"
description = "Read-only RAG and metrics assistant for MembershipFlow"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "elasticsearch[async]>=9.0.0,<10",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "langchain-core>=1.0.0",
  "langchain-google-genai>=3.0.0",
  "langgraph>=1.0.0",
  "langsmith>=0.4.0",
  "markdown-it-py>=4.0.0",
  "numpy>=2.2.0",
  "pgvector>=0.4.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "slack-bolt>=1.23.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "tree-sitter>=0.25.0,<0.26",
  "tree-sitter-java>=0.23.5",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=5.1.0",
]

[dependency-groups]
dev = [
  "arize-phoenix>=8.0.0",
  "jsonschema>=4.25.0",
  "mypy>=1.17.0",
  "openinference-instrumentation-langchain>=0.1.76",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "testcontainers[postgres]>=4.12.0",
  "types-pyyaml>=6.0.12",
]

[project.scripts]
membershipflow-ai = "membershipflow_ai.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/membershipflow_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["membershipflow_ai"]
