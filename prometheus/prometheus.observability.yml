global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'membershipflow-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8081']

  - job_name: 'membershipflow-loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'membershipflow-alloy'
    static_configs:
      - targets: ['alloy:12345']
